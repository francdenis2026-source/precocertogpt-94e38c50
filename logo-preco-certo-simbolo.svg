<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 96 96" role="img" aria-labelledby="title">
  <title id="title">Símbolo PreçoCerto</title>
  <!-- Marca simplificada: etiqueta de preço com uma seta descendente.
       Duas formas apenas, para continuar legível em 16px na aba do navegador,
       onde o desenho anterior (arco, carrinho, etiqueta, três círculos e uma
       barra) virava um borrão. -->
  <rect width="96" height="96" rx="24" fill="#082A45"/>
  <!-- Etiqueta -->
  <path d="M25 28.5A6.5 6.5 0 0 1 31.5 22H56a6.5 6.5 0 0 1 4.6 1.9l13 13a6.5 6.5 0 0 1 0 9.2L50.1 69.6a6.5 6.5 0 0 1-9.2 0l-13-13A6.5 6.5 0 0 1 25 52Z" fill="#25A844"/>
  <!-- Furo da etiqueta -->
  <circle cx="38" cy="35" r="4.6" fill="#082A45"/>
  <!-- Seta descendente: o preço que cai -->
  <path d="M57 38v15.5" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <path d="M49.5 47 57 54.5 64.5 47" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
